<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Portfolio Pro</title>
    <!-- Fuentes externas e iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Elementos Decorativos de Fondo (Blobs) -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div id="app" class="glass-panel">
        <!--
             SECCION DE AUTENTICACION (LOGIN / REGISTRO)
        -->
        <section id="auth-section" class="active">
            <div class="header-logo">
                <div class="logo-icon">💸</div>
                <h1>Crypto Portfolio</h1>
            </div>

            <!-- Selector de pestanas -->
            <div class="tabs">
                <button class="tab active" onclick="switchAuthTab('login')">Ingresar</button>
                <button class="tab" onclick="switchAuthTab('register')">Registrarse</button>
            </div>

            <!-- Formulario de Inicio de Sesion -->
            <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Usuario</label>
                    <input type="text" id="login-username" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label>Contrasena</label>
                    <input type="password" id="login-password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn primary-btn">Ingresar al Portafolio</button>
                <p class="error-msg" id="login-error"></p>
            </form>

            <!-- Formulario de Registro -->
            <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>Usuario</label>
                    <input type="text" id="reg-username" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="input-group">
                    <label>Contrasena</label>
                    <input type="password" id="reg-password" required>
                </div>
                <button type="submit" class="btn primary-btn">Crear Cuenta</button>
                <p class="error-msg" id="reg-error"></p>
            </form>
        </section>

        <!--
             SECCION DE DASHBOARD (PANEL PRINCIPAL)
        -->
        <section id="dashboard-section" class="hidden">
            <nav class="dashboard-nav">
                <div class="header-logo small">
                    <div class="logo-icon small">💎</div>
                    <h2>Dashboard</h2>
                </div>
                <button class="btn logout-btn" onclick="handleLogout()">Salir</button>
            </nav>

            <!-- Resumen Financiero Superior -->
            <div class="portfolio-summary">
                <div class="summary-card">
                    <h3>Valor Actual Total</h3>
                    <h2 id="total-value">$0.00</h2>
                </div>
                <div class="summary-card">
                    <h3>Total Invertido</h3>
                    <h2 id="total-invested">$0.00</h2>
                </div>
                <div class="summary-card" id="total-pnl-card">
                    <h3>Ganancia/Perdida Neta</h3>
                    <h2 id="total-pnl">$0.00</h2>
                </div>
            </div>

            <!-- Listado de Activos (Criptomonedas compradas) -->
            <div class="dashboard-content">
                <div class="assets-list glass-card">
                    <div class="card-header">
                        <h3>Mis Activos</h3>
                        <button class="btn icon-btn" onclick="openTransactionModal()">+ Nueva Tx</button>
                    </div>
                    <div class="table-container">
                        <table id="assets-table">
                            <thead>
                                <tr>
                                    <th>Activo</th>
                                    <th>Cantidad</th>
                                    <th>Precio Actual</th>
                                    <th>Valor Total</th>
                                    <th>Rendimiento</th>
                                </tr>
                            </thead>
                            <tbody id="assets-tbody">
                                <!-- Se llena dinamicamente mediante app.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- 
         VENTANA MODAL PARA NUEVAS TRANSACCIONES
          -->
    <div id="tx-modal" class="modal hidden">
        <div class="modal-content glass-panel">
            <span class="close-btn" onclick="closeTransactionModal()">&times;</span>
            <h2>Nueva Transaccion</h2>
            <form id="tx-form" onsubmit="submitTransaction(event)">
                <div class="input-group">
                    <label>Tipo de Operacion</label>
                    <select id="tx-type" required>
                        <option value="buy">Comprar</option>
                        <option value="sell">Vender</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Activo Cripto</label>
                    <select id="tx-asset-id" required onchange="fetchAssetPrice()">
                        <option value="">-- Seleccionar --</option>
                    </select>
                </div>
                <!-- Muestra el precio actual obtenido de la API -->
                <div class="input-group" style="margin-top: -10px; margin-bottom: 15px;">
                    <small id="current-price-display"
                        style="color: var(--primary-color); display: none; font-weight: 500;"></small>
                </div>
                <div class="input-group">
                    <label>Cantidad</label>
                    <input type="number" step="0.000001" id="tx-amount" required>
                </div>
                <div class="input-group">
                    <label>Precio de Ejecucion ($)</label>
                    <input type="number" step="0.01" id="tx-price" required>
                </div>
                <button type="submit" class="btn primary-btn w-100">Guardar Transaccion</button>
                <p class="error-msg" id="tx-error"></p>
            </form>
        </div>
    </div>

    <!-- Logica de la aplicacion -->
    <script src="app.js"></script>
</body>

</html>
